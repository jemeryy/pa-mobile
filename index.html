<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<title>PA Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #ffffff; --surface: #f7f7f5; --surface2: #efefed;
    --ink: #1f1f1e; --muted: #6f6e69; --line: #e9e9e7;
    --accent: #2383e2; --accent-soft: #e7f0fa; --accent-ink: #ffffff;
    --danger: #d44c47; --ok: #448361; --warn: #d9970d; --warn-ink: #8a5f00;
    --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --surface: #202020; --surface2: #2a2a28;
      --ink: #e8e8e6; --muted: #a3a29d; --line: #2e2e2c;
      --accent: #4f9fe0; --accent-soft: #1d2b38; --accent-ink: #0e1116;
      --warn: #e0a233; --warn-ink: #edb75c;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); min-height: 100%;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }

  /* ---------- shell ---------- */
  header {
    position: sticky; top: 0; z-index: 30; background: var(--bg);
    display: flex; align-items: center; gap: 4px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); min-height: 52px;
  }
  header .title { font-weight: 650; flex: 1; font-size: 16px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border: none; background: none; color: var(--ink);
    border-radius: 8px; flex-shrink: 0; transition: background .15s ease-out;
  }
  .iconbtn:active { background: var(--surface2); }
  .iconbtn svg { width: 21px; height: 21px; }
  .txtbtn {
    border: none; background: none; color: var(--accent); font-weight: 600;
    font-size: 15px; padding: 8px 10px; border-radius: 8px; flex-shrink: 0;
  }
  .txtbtn:active { background: var(--accent-soft); }

  main { max-width: 720px; margin: 0 auto; padding: 16px;
    padding-bottom: calc(84px + env(safe-area-inset-bottom)); }

  nav#tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; background: var(--bg); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0 6px; color: var(--muted); font-size: 11px; font-weight: 550;
  }
  #tabbar a svg { width: 23px; height: 23px; }
  #tabbar a.on { color: var(--accent); }

  /* ---------- shared bits ---------- */
  .card { background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .rowlist { border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: var(--bg); box-shadow: var(--shadow); }
  .rowlist > * { display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 14px; border: none; border-bottom: 1px solid var(--line);
    background: none; color: var(--ink); font-size: 15.5px; font-weight: 500;
    text-align: left; transition: background .15s ease-out; }
  .rowlist > *:last-child { border-bottom: none; }
  .rowlist > *:active { background: var(--surface); }
  .rowlist .ric { font-size: 19px; width: 26px; text-align: center; flex-shrink: 0; }
  .rowlist .rtx { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowlist .chev { color: var(--muted); flex-shrink: 0; opacity: .6; }
  .rowlist .rtx.two { white-space: normal; line-height: 1.35; }
  .lrow { cursor: pointer; }
  .lrow .lbox { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    border: 2px solid var(--line); display: flex; align-items: center;
    justify-content: center; font-size: 14px; color: transparent; }
  .lrow .lbox svg { width: 15px; height: 15px; }
  .lrow.done .lbox { background: #16a34a; border-color: #16a34a; color: #fff; }
  .lrow.done .ltx { color: var(--muted); }
  .lrow[disabled] { opacity: .55; }
  .sect { font-size: 13px; font-weight: 650; color: var(--muted);
    margin: 22px 4px 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .err { color: var(--danger); font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 20px; font-size: 14.5px; }
  .primary {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 8px; padding: 9px 18px; font-weight: 600; font-size: 15px;
  }
  .ghost { background: none; border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 9px 16px; font-weight: 550; font-size: 15px; }
  .ghost.danger { color: var(--danger); }
  input[type=text], input[type=password], input[type=date], input[type=time], textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 16px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  textarea { resize: none; line-height: 1.55; font-family: inherit; }
  .skel { border-radius: 10px; background: var(--surface2); height: 46px;
    margin-bottom: 8px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  .toast { position: fixed; bottom: calc(76px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%); z-index: 60;
    background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 20px;
    font-size: 13.5px; opacity: 0; transition: opacity .2s ease-out; pointer-events: none;
    max-width: 86vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; }

  /* ---------- home ---------- */
  .greet { font-size: 24px; font-weight: 700; margin: 6px 4px 2px; letter-spacing: -.01em; }
  .gdate { color: var(--muted); font-size: 14px; margin: 0 4px 18px; }
  .today .tev { display: flex; gap: 10px; padding: 5px 0; font-size: 14.5px; align-items: baseline; }
  .today .tev .tt { color: var(--muted); font-variant-numeric: tabular-nums;
    flex-shrink: 0; width: 74px; font-size: 13px; }
  .today .thead { display: flex; align-items: center; gap: 8px; font-weight: 650;
    font-size: 14px; margin-bottom: 6px; }
  .today .thead svg { width: 17px; height: 17px; color: var(--accent); }
  .tasksum { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px;
    font-size: 14.5px; }

  /* ---------- document (block editor) ---------- */
  #doc .blk { border-radius: 8px; padding: 2px 8px; margin: 0 -8px; position: relative;
    transition: background .15s ease-out; }
  #doc .blk:active:not(.editing) { background: var(--surface); }
  #doc h1 { font-size: 25px; line-height: 1.25; margin: 18px 0 6px; letter-spacing: -.01em; }
  #doc h2 { font-size: 20px; margin: 22px 0 4px; }
  #doc h3 { font-size: 17px; margin: 18px 0 2px; }
  #doc p { margin: 8px 0; }
  #doc img { max-width: 100%; border-radius: 8px; }
  #doc pre { background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-size: 13px; }
  #doc code { background: var(--surface2); padding: 1px 5px; border-radius: 5px; font-size: 13.5px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  #doc pre code { background: none; padding: 0; }
  #doc table { border-collapse: collapse; display: block; overflow-x: auto; margin: 8px 0; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 6px 10px; font-size: 14px; }
  #doc blockquote { margin: 8px 0; padding: 2px 0 2px 12px;
    border-left: 3px solid var(--line); color: var(--muted); }
  #doc ul, #doc ol { margin: 0; padding-left: 26px; }
  #doc li { margin: 4px 0; }
  #doc li::marker { color: var(--muted); }
  #doc ul.cklist { list-style: none; padding-left: 2px; }
  #doc input[type=checkbox] { width: 19px; height: 19px; margin: 0 8px 0 0;
    vertical-align: -4px; accent-color: var(--accent); }
  /* done reads as dimmed, never struck through: a ticked review item still has to be
     readable, and strikethrough says "cancelled" when a tick here means "yes, do it". */
  #doc li.done { color: var(--muted); }
  #doc .additem { display: flex; align-items: center; gap: 8px; color: var(--muted);
    background: none; border: none; padding: 6px 8px; font-size: 14px; margin-left: -6px;
    opacity: .75; }
  #doc .additem svg { width: 16px; height: 16px; }
  .blkedit textarea { min-height: 44px; }
  .blkedit .ebar { display: flex; gap: 8px; margin: 8px 0 6px; align-items: center; }
  .blkedit .ebar .sp { flex: 1; }
  .addblock { display: flex; align-items: center; gap: 8px; color: var(--muted);
    background: none; border: none; padding: 10px 8px; font-size: 14.5px; margin-top: 10px; }
  .addblock svg { width: 18px; height: 18px; }

  /* ---------- udemy script view ---------- */
  .u-tot { position: sticky; top: 53px; z-index: 20; background: var(--bg);
    padding: 8px 4px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
  .u-tot b { color: var(--ink); }
  .u-blk { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .u-mark { display: inline-block; font: 12px ui-monospace, Menlo, Consolas, monospace;
    background: var(--surface2); border-radius: 5px; padding: 3px 9px; color: var(--muted); }
  .u-mark.demo { color: var(--accent); background: var(--accent-soft); }
  .u-stats { font-size: 12px; color: var(--muted); margin-left: 8px;
    font-variant-numeric: tabular-nums; }
  .u-lbl { font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); font-weight: 650; margin: 12px 0 4px; }
  .u-lbl.anim { color: var(--accent); }
  .u-blk textarea { font-size: 15px; }
  .u-blk textarea.mono { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: var(--muted); }
  .u-cols { display: grid; grid-template-columns: minmax(280px, 420px) 1fr;
    gap: 0 20px; align-items: start; }
  @media (max-width: 780px) { .u-cols { grid-template-columns: 1fr; } }
  .board { aspect-ratio: 16/9; background: #17181b; color: #f2f2ef;
    border: 1px solid #2c2d31; border-radius: 8px; margin-top: 10px;
    padding: 5% 6%; display: flex; flex-direction: column; justify-content: center;
    overflow: hidden; line-height: 1.5;
    font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: clamp(10px, 3vw, 14px); }
  .board .b-kicker { font-size: .68em; letter-spacing: .12em; text-transform: uppercase;
    color: #8f939b; margin-bottom: .9em; font-family: -apple-system, "Segoe UI", sans-serif; }
  .board .v-line { margin: .3em 0; }
  .board .v-line:nth-child(5n+2) { color: #f2f2ef; }
  .board .v-line:nth-child(5n+3) { color: #ffd166; }
  .board .v-line:nth-child(5n+4) { color: #7fd8c8; }
  .board .v-line:nth-child(5n)   { color: #ff9e7d; }
  .board .v-line:nth-child(5n+1) { color: #9ecbff; }
  .screen { aspect-ratio: 16/9; background: #23282c; color: #d7dde1; border-radius: 8px;
    margin-top: 10px; overflow: hidden; display: flex; flex-direction: column;
    font-size: clamp(9px, 2.8vw, 13px); }
  .screen .chrome { background: #31383d; padding: .5em .9em; font-size: .8em; color: #9aa5ac;
    display: flex; gap: .5em; align-items: center; flex-shrink: 0; }
  .screen .chrome i { width: .7em; height: .7em; border-radius: 50%; background: #57646c; }
  .screen .body { padding: .9em 1.1em; overflow: hidden; line-height: 1.5; }
  .u-prose { padding: 10px 0; }
  .u-prose summary { color: var(--muted); font-size: 13px; font-weight: 600; padding: 4px 0; }
  .savebar { position: fixed; left: 0; right: 0; z-index: 40;
    bottom: calc(52px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .savebar .msg { flex: 1; font-size: 13.5px; color: var(--muted); }
  .banner { background: var(--accent-soft); border: 1px solid var(--accent);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
  .banner .brow { display: flex; gap: 10px; margin-top: 10px; }

  /* ---------- calendar / tasks ---------- */
  .dayhead { font-size: 14px; font-weight: 650; margin: 20px 4px 6px; }
  .dayhead small { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .dayhead.today { color: var(--accent); }
  .ev { display: flex; gap: 12px; padding: 11px 14px; align-items: baseline; }
  .ev .et { width: 76px; flex-shrink: 0; color: var(--muted); font-size: 13px;
    font-variant-numeric: tabular-nums; line-height: 1.4; }
  .ev .es { flex: 1; font-weight: 500; font-size: 15px; }
  .ev .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    flex-shrink: 0; align-self: center; }
  .task { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start;
    transition: opacity .25s ease-out, transform .25s ease-out; }
  .task.gone { opacity: 0; transform: translateX(12px); }
  .task .tk { width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--muted);
    background: none; flex-shrink: 0; margin-top: 1px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; color: transparent; }
  .task .tk svg { width: 13px; height: 13px; }
  .task .tk:active { border-color: var(--accent); color: var(--accent); }
  .task .tbody { flex: 1; min-width: 0; }
  .task .ttl { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .task .due { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .task .due.over { color: var(--danger); font-weight: 600; }
  .task .tnotes { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .addform { display: flex; flex-direction: column; gap: 10px; }
  .addform .frow { display: flex; gap: 10px; align-items: center; }
  .addform .frow > * { flex: 1; }
  .addform .frow label { flex: 0 0 auto; font-size: 14px; color: var(--muted); }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding: 2px; }
  .chips button { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 16px; padding: 6px 14px; font-size: 13.5px; font-weight: 550;
    white-space: nowrap; }
  .chips button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .connect { text-align: center; padding: 26px 18px; }
  .connect p { margin: 0 0 14px; color: var(--muted); font-size: 14.5px; }

  /* ---------- month grid ---------- */
  .cal-chrome { display: flex; align-items: center; gap: 2px; margin: 2px 0 10px; }
  .cal-chrome .mtitle { flex: 1; font-size: 19px; font-weight: 700; letter-spacing: -.01em; padding-left: 4px; }
  .cal-chrome .txtbtn { padding: 6px 10px; }
  .cal-wk { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: 11px; font-weight: 650; color: var(--muted); padding: 2px 0 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; touch-action: pan-y; }
  .cal-day { border: none; background: none; padding: 5px 0 4px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; color: var(--ink); border-radius: 10px; min-height: 46px; }
  .cal-day:active { background: var(--surface); }
  .cal-day .dn { font-size: 14px; width: 28px; height: 28px; line-height: 28px; text-align: center;
    border-radius: 50%; font-variant-numeric: tabular-nums; }
  .cal-day.oth { color: var(--muted); opacity: .45; }
  .cal-day.today .dn { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-day.sel { background: var(--surface); }
  .cal-day.sel:not(.today) .dn { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); font-weight: 650; }
  .cal-day .dots { display: flex; gap: 3px; height: 5px; }
  .cal-day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .cal-day.oth .dots i { background: var(--muted); }

  /* ---------- settings ---------- */
  .set .card h3 { margin: 0 0 4px; font-size: 15.5px; }
  .set .card p { margin: 4px 0 10px; color: var(--muted); font-size: 13.5px; }
  .set .stat { font-size: 13.5px; margin-top: 8px; }
  .set .stat.ok { color: var(--ok); }

  /* ---------- dashboard: attention, projects, jobs ---------- */
  .flag { border-left: 3px solid var(--warn); }
  .flag .ttl { font-weight: 620; font-size: 15px; margin-bottom: 3px; }
  .flag .det { color: var(--muted); font-size: 14px; }
  .flag.green { border-left-color: var(--ok); }
  .flag.dim { border-left-color: var(--line); }
  .btngrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bigbtn { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; padding: 16px 10px; min-height: 84px; position: relative;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    color: var(--ink); font-size: 14.5px; font-weight: 600; text-align: center; }
  .bigbtn:active { background: var(--surface2); }
  .bigbtn .em { font-size: 23px; }
  .bigbtn.wide { grid-column: 1 / -1; flex-direction: row; min-height: 0; padding: 14px;
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .bigbtn .badge { position: absolute; top: 8px; right: 10px; min-width: 19px; height: 19px;
    border-radius: 10px; background: var(--warn); color: #3b2500; font-size: 11.5px;
    font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  .actrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .actrow > button { flex: 1 1 46%; }
  .numgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .num { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .num .v { font-size: 26px; font-weight: 660; line-height: 1.15; }
  .num .l { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .num .s { font-size: 12px; color: var(--muted); opacity: .8; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    font-weight: 600; padding: 3px 10px; border-radius: 999px;
    background: var(--surface2); color: var(--muted); }
  .chip.running { background: var(--accent-soft); color: var(--accent); }
  .chip.check { background: rgba(214,150,0,.16); color: var(--warn-ink); }
  .chip.done { color: var(--ok); }
  .chip.failed { color: var(--danger); }
  .joblist > div { display: flex; align-items: center; gap: 10px; padding: 9px 2px;
    border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .joblist > div:last-child { border-bottom: none; }
  .joblist .jl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- chat with the agent ---------- */
  .bubble { max-width: 84%; border-radius: 16px; padding: 9px 13px; margin-bottom: 8px;
    font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.me { background: var(--accent); color: var(--accent-ink);
    margin-left: auto; border-bottom-right-radius: 5px; }
  .bubble.ai { background: var(--surface); border: 1px solid var(--line);
    border-bottom-left-radius: 5px; white-space: normal; }
  .bubble.ai > :first-child { margin-top: 0; }
  .bubble.ai > :last-child { margin-bottom: 0; }
  .bubble.ai pre { overflow-x: auto; }
  /* which model answered: local Gemma replies say so, Claude's stay unmarked */
  .bubble.ai .by { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .sysline { font-size: 13px; color: var(--muted); font-style: italic;
    margin: 6px 4px 10px; }
  /* model + effort pickers, one compact row at the top of a chat */
  .chatopts { display: flex; gap: 8px; margin-bottom: 12px; }
  .chatopts select { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 13px; font-weight: 550; }

  /* ---------- agent side panel ----------
     The agent is a panel over the page, not a page of its own, so it survives
     navigation and can be told "this page". Collapsed = the round button. */
  #agentfab { position: fixed; right: 14px; z-index: 35;
    bottom: calc(66px + env(safe-area-inset-bottom));

  /* which page the next message will carry as context */

  @media (min-width: 900px) { body.agent-open main { margin-right: min(94vw, 420px); } }

  /* ---------- concept map (Aegis, embedded) ---------- */

'use strict';

};
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => $('toast').classList.remove('show'), 2400);
}
function pad(n) { return String(n).padStart(2, '0'); }
function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function fmtTime(d) {
  let h = d.getHours(); const m = d.getMinutes(); const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12; return h + (m ? ':' + pad(m) : '') + ap;
}
function dayLabel(d) {
  const t = new Date(); const tm = new Date(); tm.setDate(t.getDate()+1);
  if (dkey(d) === dkey(t)) return 'Today';
  if (dkey(d) === dkey(tm)) return 'Tomorrow';
  return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
}
function skels(n) { return Array.from({length:n}, () => '<div class="skel"></div>').join(''); }

/* =============== state =============== */
const DEMO = new URLSearchParams(location.search).has('demo');
const REPO = 'jemeryy/personal-assistant';
const API = 'https://api.github.com/repos/' + REPO + '/contents/';
const GSCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/tasks';
let token = localStorage.getItem('pa_token') || '';
let gcid = localStorage.getItem('pa_gcid') || '';
let gtok = JSON.parse(localStorage.getItem('pa_gtok') || 'null');
let cur = { path: '', text: '', sha: '' };   // currently open repo file

/* =============== GitHub layer =============== */
async function gh(path, opts = {}) {
  opts.headers = Object.assign({
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
  }, opts.headers || {});
  const r = await fetch(API + encodeURI(path).replace(/#/g, '%23') + '?ref=main&t=' + Date.now(), opts);
  if (r.status === 401) { localStorage.removeItem('pa_token'); token = ''; route(); throw new Error('GitHub token rejected'); }
  if (!r.ok && r.status !== 409) throw new Error('GitHub ' + r.status + ' on ' + path);
  return r;
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function b64encode(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}
async function ghGet(path) { return (await gh(path)).json(); }   // file obj or dir array
async function loadFile(path) {
  const j = await ghGet(path);
  return { path, sha: j.sha, text: b64decode(j.content) };
}
/* returns new sha, or null on conflict (409) */
async function saveFile(path, text, sha, msg) {
  const r = await gh(path, { method: 'PUT', body: JSON.stringify({
    message: msg || ('phone: edit ' + path), content: b64encode(text), sha, branch: 'main' }) });
  if (r.status === 409) return null;
  return (await r.json()).content.sha;
}

/* =============== header / tabbar / router =============== */
function setHeader(title, opts = {}) {
  $('htitle').textContent = title;
  const back = $('hback');
  if (opts.left) {                       // a view can own the left button (e.g. chat's menu)
    back.style.display = ''; back.innerHTML = ICONS[opts.left.icon]; back.onclick = opts.left.fn;
  } else {
    back.style.display = opts.back ? '' : 'none';
    back.innerHTML = ICONS.back;
    back.onclick = () => history.length > 1 ? history.back() : (location.hash = '');
  }
  const act = $('hactions'); act.innerHTML = '';
  (opts.actions || []).forEach(a => {
    const b = document.createElement('button');
    if (a.icon) { b.className = 'iconbtn'; b.innerHTML = ICONS[a.icon]; b.setAttribute('aria-label', a.label || a.icon); }
    else { b.className = 'txtbtn'; b.textContent = a.label; }

}
function drawTabs() {
  const h = location.hash;
  const on = h.startsWith('#/cal') ? 'cal' : h.startsWith('#/tasks') ? 'tasks' : 'home';
  $('tabbar').innerHTML = [

}
const UDEMY_RE = /^projects\/udemy-course\/scripts\/[^/]+\.md$/;
let leaveGuard = null;   // {check, dirty, hash} set by views with unsaved state
let viewCleanup = null;  // teardown a view registers (map poll timer, chat mic) run on next route
let suppressRoute = false;
let booted = false;      // first route of a page load: a reopened chat starts fresh
async function route() {
  if (suppressRoute) { suppressRoute = false; return; }
  if (leaveGuard && !leaveGuard.check()) {
    suppressRoute = true; location.hash = leaveGuard.hash; return;
  }
  leaveGuard = null;
  if (viewCleanup) { viewCleanup(); viewCleanup = null; }
  drawTabs();
  window.scrollTo(0, 0);
  if (!token && !DEMO) return tokenView();
  const h = decodeURIComponent(location.hash);
  // The agent is a panel, not a page: an old #/chat link opens it over home.
  if (h === '#/chat' || h.startsWith('#/chat/')) {
    const t = h.startsWith('#/chat/') ? h.slice(7) : '';
    suppressRoute = true; location.hash = '';
    await homeView();
    return openAgent(t || 'new');
  }
  // the panel survives a reload, on the same thread, so a page refresh is not a lost chat
  if (!booted) { booted = true; if (localStorage.getItem('pa_agent') === '1') openAgent(); }
  try {
    if (h.startsWith('#/weekly')) return await openWeeklyPlan();
    if (h.startsWith('#/subject/')) return subjectView(h.slice(10));
    if (h.startsWith('#/lessons/')) return await lessonsView(h.slice(10));
    if (h.startsWith('#/lesson/')) return await lessonView(h.slice(9));
    if (h.startsWith('#/map/')) return await mapView(h.slice(6));
    if (h === '#/viz') return await vizListView();
    if (h.startsWith('#/viz/')) return await lessonView(h.slice(6));   // viz reuse the self-contained-HTML renderer
    if (h.startsWith('#/raw/')) return await rawView(h.slice(6));
    if (h.startsWith('#/gate/')) return await gateView(h.slice(7));
    if (h.startsWith('#/proj/')) return await projView(h.slice(7));
    if (h.startsWith('#/p/')) {
      const path = h.slice(4);
      if (UDEMY_RE.test(path)) return await udemyView(path);
      return await openPage(path);
    }
    if (h.startsWith('#/cal')) return await calView();
    if (h.startsWith('#/tasks')) return await tasksView();
    if (h.startsWith('#/settings')) return settingsView();
    return await homeView();
  } catch (e) { $('main').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', e => { if (leaveGuard && leaveGuard.dirty()) e.preventDefault(); });

/* =============== first-run: GitHub token =============== */
function tokenView() {

}

/* =============== home =============== */
async function homeView() {

        <span class="ric">${p.icon || '&#128196;'}</span>

/* visualise skill publishes self-contained HTML here; date-prefixed filenames sort newest-first */
async function vizListView() {

  if (DEMO) {
    $('main').innerHTML = `<div class="rowlist"><a href="#/viz/phone/viz/2026-07-17-investment-pipeline.html">

/* =============== dashboard: home feed, project pages, jobs ===============
   Every project page is the same renderer over mailbox/state/<key>.json, so a
   new project is a new file, not new code. Contract: tools/pa_state.py. */
const HOME_PATH = 'mailbox/home.json';
const STATE_PATH = k => 'mailbox/state/' + k + '.json';
const JOB_PATH = id => 'mailbox/jobs/' + id + '.json';
/* mirrors TRANSITIONS in tools/agent_loop.py; test_agent_loop.py fails if they drift */
const JOB_TRANSITIONS = {
  queued: ['running', 'failed'],
  running: ['awaiting_check', 'done', 'failed'],
  awaiting_check: ['running', 'done', 'failed'],
  done: [], failed: [],
};
const JOB_WORDS = { queued: 'in line', running: 'running', awaiting_check: 'your check',
                    done: 'done', failed: 'failed' };
const JOB_CLASS = { queued: '', running: 'running', awaiting_check: 'check',
                    done: 'done', failed: 'failed' };
function nowIso() { return new Date().toISOString().replace(/\.\d+Z$/, 'Z'); }
const DEMO_PROJECTS = [
  ['chess', 'Chess', '&#9822;'], ['investments', 'Investments', '&#128200;'],
  ['udemy', 'Udemy', '&#127916;'], ['uni', 'Uni', '&#127891;'],
  ['fara', 'FARA', '&#129504;'], ['athena', 'Athena', '&#128506;'],
  ['japanese', 'Japanese', '&#127471;&#127477;'], ['system', 'System', '&#128295;'],
];
const DEMO_HOME = {
  attention: [
    { title: '✉️ School email worth reading', detail: 'Class sign-up (BOSS) opens Monday. Read before Friday.',
      tone: 'amber', project: 'uni', projectTitle: 'Uni', href: '#/proj/uni' },
    { title: '⏳ Prepare for 3pm', detail: "Nathanael's lesson 12 preview is still waiting for your check.",
      tone: 'amber', project: 'chess', projectTitle: 'Chess', href: '#/chess/nathanael' },
  ],
  projects: DEMO_PROJECTS.map(([key, title, icon]) => ({ key, title, icon, badge: key === 'uni' || key === 'chess' ? 1 : 0 })),
  jobs: [{ id: 'j-demo1', skill: 'build-chess-lesson', label: 'Build lesson 12', project: 'chess',
           state: 'awaiting_check', note: 'preview ready' }],
  busy: false,
};
function jobChip(state) {
  // only the box moves a job on, so if it has gone silent (see BEAT_PATH) a job
  // still claiming to be in flight died with it and nobody was left to say so
  if (boxQuiet && (state === 'queued' || state === 'running'))
    return `<span class="chip failed" title="The agent box stopped responding while this was going">stopped</span>`;
  return `<span class="chip ${JOB_CLASS[state] || ''}">${JOB_WORDS[state] || esc(state)}</span>`;
}
/* Fire a skill: the phone writes the job file, the agent picks it up. */
async function runSkill(o) {
  const id = 'j-' + Math.random().toString(16).slice(2, 12);
  // fired from a parent page but about one student -> file it under that student's
  // page, so his gate shows where he goes looking for it
  const sub = (o.args || {}).student;
  const proj = sub && o.project ? o.project.split('.')[0] + '.' + sub : o.project;
  // a job's thread is its own id (mirrors agent_loop.create_job): the build's
  // questions, his answers and the result all land in one chat he can read back
  const job = { id, skill: o.skill, args: o.args || {}, prompt: o.prompt || null,
    project: proj || null, label: o.label || o.skill, state: 'queued',
    thread: id, created: nowIso(), updated: nowIso() };
  if (DEMO) return job;
  await saveFile(JOB_PATH(id), JSON.stringify(job, null, 2) + '\n', undefined, 'phone: run ' + o.skill);
  // open the thread now, so a build that has not spoken yet is still in the chat
  // list. `system` on purpose: a `user` line here would read as a question nobody
  // answered and the loop would eventually reply to it.
  await saveFile(chatPath(id), JSON.stringify(chatMsg('system', (o.label || o.skill) + ' started')) + '\n',
                 undefined, 'phone: open ' + o.skill + ' chat').catch(() => {});
  return job;
}
/* Flip a job's state (approve, ask for changes). The phone writes the mailbox
   directly, so it must refuse an illegal move itself: there is no server. */
async function flipJob(id, state, fields) {
  const f = await loadFile(JOB_PATH(id));
  const job = JSON.parse(f.text);
  if (job.state !== state && !(JOB_TRANSITIONS[job.state] || []).includes(state))
    throw new Error('Cannot go from ' + JOB_WORDS[job.state] + ' to ' + JOB_WORDS[state]);
  Object.assign(job, fields || {}, { state, updated: nowIso() });
  const sha = await saveFile(JOB_PATH(id), JSON.stringify(job, null, 2) + '\n', f.sha, 'phone: ' + state);
  if (!sha) throw new Error('The agent changed this job while you were looking. Pull to refresh.');
  // Every list on the phone reads home.json, which only the agent rewrites, so a
  // gate you just answered came back on the next reload for as long as the box
  // took to notice — forever, the day the box's pull was broken (2026-07-30).
  // The job file stays the truth (gate kept: that is how the box knows to resume).
  await upsertHomeJob({ ...job, gate: null });
  return job;
}
/* Record a job in home.json so it survives a reload before the agent republishes
   it (best effort: the job file is written either way). */
async function upsertHomeJob(job) {
  if (DEMO) return;
  try {
    const f = await loadFile(HOME_PATH);
    const h = JSON.parse(f.text);
    h.jobs = [job, ...(h.jobs || []).filter(j => j.id !== job.id)].slice(0, 20);
    await saveFile(HOME_PATH, JSON.stringify(h, null, 2) + '\n', f.sha, 'phone: ' + job.state);
  } catch (e) { /* the agent republishes home.json on its next pass */ }
}
/* Drop a job's gate from the home feed only. Best effort: the box republishes
   home.json from the job files on its next pass either way. */
async function clearHomeGate(id) {
  if (DEMO) return;
  try {
    const f = await loadFile(HOME_PATH);

/* The box stamps mailbox/beat.txt every few minutes (agent_loop.beat). This is
   NOT a status light: a box that is merely idle is nobody's business. It exists
   for the one case nothing else catches — the box dying mid-build. Job state is
   written BY the box, so when it stops, everything it was running keeps reading
   "running" forever with nothing left alive to mark it failed (both chess builds
   did exactly that on 2026-08-05). Silence past BEAT_STALE means those jobs are
   dead, so the chip says so. */
const BEAT_PATH = 'mailbox/beat.txt';

async function checkBox() {
  if (DEMO || !token) return boxQuiet;
  let age = null;
  try {
    age = Date.now() - Date.parse(b64decode((await ghGet(BEAT_PATH)).content).trim());
  } catch (e) { /* no beat file, no network, no answer */ }
  // unknown is NOT quiet: a network blip must never accuse a healthy build
  boxQuiet = age >= BEAT_STALE;
  return boxQuiet;
}

/* The decision on its own page: the question, the short review the build wrote
   for it (`gate.review` — only what he must look at), then one button per answer.
   Answering flips the job to `running` with that answer as its `note`, which is
   what agent_loop.resume_prompt hands back to the build. The long resume handoff
   (`gate.file`) is a link, not the thing he reads to decide. */
async function gateView(id) {
  setHeader('Review', { back: true });
  $('main').innerHTML = skels(3);
  let job;
  try { job = JSON.parse((await loadFile(JOB_PATH(id))).text); }
  catch (e) { $('main').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const g = job.gate || {};
  setHeader(job.label || job.skill, { back: true });
  if (job.state !== 'awaiting_check' || !g.question) {
    $('main').innerHTML = '<div class="empty">Already answered.</div>';
    return;
  }
  let md = g.review || '';
  if (!md && g.file) md = await loadFile(g.file).then(f => f.text).catch(() => '');
  const opts = (g.options || []).length ? g.options : GATE_OPTIONS;
  $('main').innerHTML = `
    <div class="card flag"><div class="ttl">${esc(g.question)}</div></div>
    <div id="doc">${md ? (window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`)
                       : '<p class="muted">The build wrote no detail.</p>'}</div>
    ${g.review && g.file ? `<p class="muted" style="margin-top:16px">
      <a href="#/p/${encodeURIComponent(g.file)}">Full handoff</a></p>` : ''}
    <div class="actrow" style="margin-top:18px">${opts.map((o, k) =>
      `<button class="${k ? 'ghost' : 'primary'}" data-ans="${k}" style="flex:1 1 46%">${
        esc(typeof o === 'string' ? o : o.label)}</button>`).join('')}</div>`;
  $('main').querySelectorAll('[data-ans]').forEach(b => {
    b.onclick = () => answer(opts[+b.dataset.ans], b); });

  async function answer(opt, btn) {
    // Changes are a conversation, not one shot down a text box: open the build's
    // own chat, where the question is already the last message. agent_loop turns
    // what he sends there into this gate's answer, so nothing is flipped here.
    // Leave the page too: its buttons stay live otherwise, and a stale tap would
    // overwrite the answer he just typed (or silently answer the NEXT gate).
    // The label is prefilled so a gate with two ask-options still says which one.
    if (opt.ask) {
      openAgent(job.id);                 // always the job's own thread: the only
      chatPrefill(opt.label + ': ');     // one agent_loop reads as a gate answer
      toast(opt.ask);
      history.length > 1 ? history.back() : (location.hash = '');
      return;
    }
    const note = typeof opt === 'string' ? opt : opt.label;
    btn.disabled = true;
    try {
      await flipJob(job.id, 'running', { note });
      toast('Sent to the agent.');
      history.length > 1 ? history.back() : (location.hash = '');
    } catch (e) { toast(e.message); btn.disabled = false; }
  }
}

  async function drillDownRows() {
    if (DEMO) return;
    await Promise.all((st.rest || []).map(async r => {
      const child = (r.href || '').startsWith('#/proj/') ? r.href.slice(7) : '';

  async function toggleLesson(i, btn) {

  }
  // Taps are optimistic, so two quick ticks would race on the same file sha:
  // chain the writes, each one re-reading the sha it is writing against.
  let saving = Promise.resolve();
  function persistLessons() {
    saving = saving.catch(() => {}).then(writeLessons);
    return saving;
  }
  async function writeLessons() {
    if (DEMO) return;
    const f = await loadFile(STATE_PATH(key));
    const state = JSON.parse(f.text);
    state.lessons = st.lessons; state.one_tap = st.one_tap;
    await saveFile(STATE_PATH(key), JSON.stringify(state, null, 2) + '\n', f.sha, 'phone: tick lesson');
  }
  /* Resolve a needs_you card: run its action (a note to the agent, maybe a
     skill), then clear it from this page's state file AND the home feed so it
     stops showing. The phone owns both writes here; the agent regenerates them. */
  async function resolveNeed(ni, ai, btn) {
    const item = st.needs_you[ni]; if (!item) return;
    const act = ai >= 0 ? (item.actions || [])[ai] : null;
    let note = '';
    if (act && act.ask) {
      const v = prompt(act.ask);
      if (v === null) return;                        // cancelled: leave the card
      note = v.trim();
    }
    btn.disabled = true;
    try {
      if (act) {
        const said = act.say || `${act.label}: ${item.title}`;
        await appendChat(note ? `${said} — ${note}` : said);
        if (act.skill) await runSkill({ project: key, skill: act.skill, args: act.args || {}, label: act.label });
      }
      // a review card can carry `tick: N`: passing review IS the done-tick, so
      // flip the lesson taught here too (the chess-tick Action puts ✅ in the Doc).
      if (act && act.tick != null && st.lessons) {
        const it = (st.lessons.items || []).find(x => x.n === act.tick);
        if (it) { it.taught = true; st.one_tap = lessonButton(); }
      }
      st.needs_you.splice(ni, 1);
      await persistNeeds();
      await clearHomeAttention(item.title);
      render();
      toast(act ? 'Sent to the agent.' : 'Cleared.');
    } catch (e) { toast(e.message); btn.disabled = false; }
  }
  async function appendChat(text) {
    if (DEMO) return;
    const f = await loadFile(CHAT_PATH).catch(() => null);
    const base = f && f.text ? (f.text.endsWith('\n') ? f.text : f.text + '\n') : '';
    await saveFile(CHAT_PATH, base + JSON.stringify(chatMsg('user', text)) + '\n',
                   f ? f.sha : undefined, 'phone: resolve note');
  }
  async function persistNeeds() {
    if (DEMO) return;
    const f = await loadFile(STATE_PATH(key));
    const state = JSON.parse(f.text); state.needs_you = st.needs_you;
    if (st.lessons) { state.lessons = st.lessons; state.one_tap = st.one_tap; }
    await saveFile(STATE_PATH(key), JSON.stringify(state, null, 2) + '\n', f.sha, 'phone: resolve needs_you');
  }
  async function clearHomeAttention(title) {
    if (DEMO) return;
    try {
      const f = await loadFile(HOME_PATH);
      const home2 = JSON.parse(f.text);
      const kept = (home2.attention || []).filter(a => a.title !== title);
      if (kept.length !== (home2.attention || []).length) {
        home2.attention = kept;
        await saveFile(HOME_PATH, JSON.stringify(home2, null, 2) + '\n', f.sha, 'phone: clear attention');
      }
    } catch (e) { /* best effort: the state file is already cleared */ }
  }
  async function fire(t, b) {
    let said = '';
    if (t.ask) {
      const v = prompt(t.ask);
      if (!v || !v.trim()) return;
      said = v.trim();
    }
    if (t.confirm && !confirm(t.confirm)) return;
    b.disabled = true;
    try {
      if (t.job) {
        // the gate: nothing moves past your check until this flip is committed
        await flipJob(t.job, t.to || 'running', said ? { note: said } : {});
        const j = jobs.find(x => x.id === t.job);
        if (j) { j.state = t.to || 'running'; if (said) j.note = said; }
        st.one_tap = [];                       // this decision is made; don't offer it twice
        toast('Sent to the agent.');
      } else {
        const args = said ? Object.assign({}, t.args || {}, { input: said }) : (t.args || {});
        const job = await runSkill({ project: key, skill: t.skill, args, label: t.label });
        jobs.unshift(Object.assign({}, job, { state: 'queued' }));
        upsertHomeJob(job);       // so it survives a reload before the agent rewrites home
        toast('Sent. Watch it under Work.');
      }
      render();
    } catch (e) { toast(e.message); b.disabled = false; }
  }
}

/* =============== chat with the agent ===============
   The mailbox contract lives in tools/agent_loop.py: one JSON object per line,
   appended by both sides. The phone only ever appends; the agent's replies
   arrive as new lines that the poll picks up. */
const chatPath = t => 'mailbox/chat/' + t + '.jsonl';
const CHAT_PATH = chatPath('main');   // the default thread; resolve-notes land here
/* A chat's title is its FIRST line, whoever wrote it; each thread file is one
   saved chat. First line, not first user line: a build's thread opens with a
   system line, and titling off the first user line would rename that row out from
   under him the moment he answered its gate. */
function chatTitle(msgs) {
  const u = (msgs || [])[0];
  const t = u && u.text ? u.text.trim().replace(/\s+/g, ' ') : '';
  return t ? (t.length > 42 ? t.slice(0, 42) + '…' : t) : 'New chat';
}
function ago(ts) {
  if (!ts) return '';
  const s = (Date.now() - new Date(ts).getTime()) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  return Math.floor(s / 604800) + 'w';
}
function chatParse(text) {
  return text.split('\n').filter(l => l.trim()).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean);
}
function chatMsg(role, text, extra) {
  return { id: 'm-' + Math.random().toString(16).slice(2, 12), role,
           ts: new Date().toISOString().replace(/\.\d+Z$/, 'Z'), text, ...(extra || {}) };
}
const DEMO_CHAT = [
  { id: 'm-1', role: 'user', text: 'How is the lesson build going?' },
  { id: 'm-2', role: 'assistant', text: 'Lesson 12 preview is ready, waiting for your check. Two boards were rebuilt because the first images were blurry.\n\nWant me to start sourcing lesson 13 while you review?' },
  { id: 'm-3', role: 'user', text: 'Yes, start on 13' },
];
/* Voice: the phone's own speech engine, no service, no model. Input is a bonus
   (the keyboard's dictation key always works); reading replies aloud is the
   part that makes this usable hands-free. */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let speakOn = localStorage.getItem('pa_speak') === '1';
function speak(text) {
  if (!speakOn || !window.speechSynthesis) return;
  const plain = String(text)
    .replace(/```[\s\S]*?```/g, ' code block ')
    .replace(/https?:\/\/\S+/g, ' link ')
    .replace(/[*_`#>|]/g, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
  const u = new SpeechSynthesisUtterance(plain);
  u.rate = 1.05;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
/* Chats: every mailbox/chat/*.jsonl is one saved conversation. The agent loop
   already answers any thread, so a new chat is just a new file. */
function newThread() { return 'c-' + Date.now().toString(36); }

/* One meta per saved chat (title, preview, time), newest first.
   ponytail: one file read per chat, and there is now one chat per build, so this
   grows about a file a day forever. Fine at today's handful; when the list gets
   slow or GitHub starts rate-limiting it, have the box write a
   mailbox/chat/index.json (title + ts + preview) and read only that. */
async function chatMetas() {
  if (DEMO) return [{ thread: 'main', title: 'How is the lesson build going?',
    preview: 'You: Yes, start on 13', ts: nowIso() }];
  const entries = await ghGet('mailbox/chat').catch(() => []);
  const files = (Array.isArray(entries) ? entries : []).filter(e => e.type === 'file' && e.name.endsWith('.jsonl'));
  const metas = await Promise.all(files.map(async f => {
    const thread = f.name.replace(/\.jsonl$/, '');
    try {
      const msgs = chatParse(b64decode((await ghGet(f.path)).content));
      const last = msgs[msgs.length - 1];
      return { thread, sha: f.sha, title: chatTitle(msgs), ts: last ? last.ts : '',
        preview: last ? (last.role === 'user' ? 'You: ' : '') + String(last.text || '').replace(/\s+/g, ' ').slice(0, 60) : '' };
    } catch (e) { return { thread, sha: f.sha, title: thread, ts: '', preview: '' }; }
  }));
  return metas.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
}

/* Model + effort the box runs a message with. Values map straight to the CLI's
   --model / --effort; the pick persists so the next new chat inherits it. */
const CHAT_MODELS = [['Sonnet 4.6', 'claude-sonnet-4-6'], ['Sonnet 5', 'claude-sonnet-5'],
  ['Opus 5', 'claude-opus-5'], ['Haiku 4.5', 'claude-haiku-4-5-20251001'],
  ['Fable 5', 'claude-fable-5'], ['Opus 4.8', 'claude-opus-4-8']];
const CHAT_EFFORTS = ['low', 'medium', 'high', 'xhigh', 'max'];
let selModel = localStorage.getItem('pa_model') || 'claude-sonnet-4-6';
let selEffort = localStorage.getItem('pa_effort') || 'medium';
function optSelect(id, pairs, cur) {
  return `<select id="${id}">` + pairs.map(([lbl, val]) =>
    `<option value="${val}"${val === cur ? ' selected' : ''}>${esc(lbl)}</option>`).join('') + '</select>';
}
/* The panel: one agent, always the same thread state, floating over any page.
   It outlives routing on purpose (that is what lets a message say "this page"),
   so it owns its own poll timer instead of the router's viewCleanup. */
let agT = '', agMsgs = [], agSha, agText0 = '', agSending = false, agTimer = null, agRec = null;

function agentOpen() { return document.body.classList.contains('agent-open'); }
/* Which page he is looking at, as something the box can open: a repo path where
   the page IS a file, otherwise just the title (Calendar, Tasks). */
function pageRef() {
  const h = decodeURIComponent(location.hash);
  const title = ($('htitle').textContent || '').trim();
  const tail = h.replace(/^#\/[a-z]+\//, '');
  let path = '';
  if (/^#\/(p|raw|lesson|viz)\//.test(h)) path = tail;
  else if (h.startsWith('#/proj/')) path = STATE_PATH(tail);
  else if (h.startsWith('#/gate/')) path = JOB_PATH(tail);
  else if (!h || h === '#' || h === '#/') path = HOME_PATH;
  return { title, path };
}
function showPage() {
  const el = $('apgctx'); if (!el) return;
  const p = pageRef();
  el.textContent = p.path ? 'On: ' + p.path : p.title ? 'On: ' + p.title : '';
}
function agentShell() {
  let el = $('agent');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'agent';
  el.innerHTML = `
    <div class="ahd">
      <button class="iconbtn" id="aclose" aria-label="Collapse">${ICONS.chev}</button>
      <div class="atitle" id="atitle">Agent</div>
      <button class="iconbtn" id="alist" aria-label="Past chats">${ICONS.menu}</button>
      <button class="iconbtn" id="anew" aria-label="New chat">${ICONS.plus}</button>
      <button class="iconbtn" id="aspeak" aria-label="Read replies aloud">${speakOn ? '🔊' : '🔇'}</button>
    </div>
    <div class="abody" id="abody"></div>
    <div class="afoot">
      ${SpeechRec ? '<button class="ghost" id="chatmic" aria-label="Speak">&#127908;</button>' : ''}
      <textarea id="chatin" rows="1" enterkeyhint="send" placeholder="Ask about this page…"></textarea>
      <button class="primary" id="chatsend">Send</button>
    </div>`;
  document.body.appendChild(el);
  $('aclose').onclick = closeAgent;
  $('alist').onclick = showChats;
  $('anew').onclick = () => openThread(newThread());
  $('aspeak').onclick = () => {
    speakOn = !speakOn; localStorage.setItem('pa_speak', speakOn ? '1' : '0');
    if (!speakOn && window.speechSynthesis) speechSynthesis.cancel();
    $('aspeak').textContent = speakOn ? '🔊' : '🔇';
  };
  $('chatsend').onclick = agSend;
  const ta = $('chatin');
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 110) + 'px'; };
  // Enter sends. Two paths on purpose: a hardware keyboard fires keydown, but a
  // phone's on-screen keyboard often reports keydown as key 229 / Unidentified and
  // only shows its intent as a beforeinput insertLineBreak. Catch both.
  // Shift+enter still writes a newline (hardware only; phones have no shift).
  ta.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); agSend(); }
  };
  ta.addEventListener('beforeinput', e => {
    if (e.inputType === 'insertLineBreak' || (e.inputType === 'insertText' && e.data === '\n')) {
      e.preventDefault(); agSend();
    }
  });
  if (SpeechRec && $('chatmic')) $('chatmic').onclick = agMic;
  return el;
}
/* thread: a thread id, 'new' for a fresh one, or nothing to reopen the last. */
function openAgent(thread) {
  agentShell();
  document.body.classList.add('agent-open');
  localStorage.setItem('pa_agent', '1');
  const t = thread === 'new' ? newThread()
          : thread || agT || sessionStorage.getItem('pa_thread') || newThread();
  if (t !== agT || !agTimer) openThread(t); else showPage();
}
function closeAgent() {
  document.body.classList.remove('agent-open');
  localStorage.setItem('pa_agent', '0');
  clearInterval(agTimer); agTimer = null;
  if (agRec) { try { agRec.stop(); } catch (e) {} }
  if (window.speechSynthesis) speechSynthesis.cancel();
}
async function openThread(t) {
  agT = t; sessionStorage.setItem('pa_thread', t);
  agMsgs = []; agSha = undefined; agText0 = '';
  clearInterval(agTimer); agTimer = null;
  $('atitle').textContent = 'Agent';
  $('abody').innerHTML = `
    <div class="chatopts">
      ${optSelect('optmodel', CHAT_MODELS, selModel)}
      ${optSelect('opteffort', CHAT_EFFORTS.map(e => [e[0].toUpperCase() + e.slice(1), e]), selEffort)}
    </div>
    <div class="pgctx" id="apgctx"></div>
    <div id="chatlog">${skels(2)}</div>`;
  $('optmodel').onchange = e => { selModel = e.target.value; localStorage.setItem('pa_model', selModel); };
  $('opteffort').onchange = e => { selEffort = e.target.value; localStorage.setItem('pa_effort', selEffort); };
  if (DEMO) { agMsgs = t === 'main' ? DEMO_CHAT : []; agRender(); return; }
  const f = await loadFile(chatPath(t)).catch(() => null);
  if (agT !== t) return;                                  // switched threads mid-load
  if (f) { agSha = f.sha; agText0 = f.text; agMsgs = chatParse(f.text); }
  agRender();
  agTimer = setInterval(agPoll, 5000);
}
function agRender() {
  const log = $('chatlog'); if (!log) return;
  const waiting = agMsgs.length && agMsgs[agMsgs.length - 1].role === 'user';
  log.innerHTML = (agMsgs.length
    ? agMsgs.map(m => m.role === 'system' ? `<div class="sysline">${esc(m.text)}</div>`
      : m.role === 'user' ? `<div class="bubble me">${esc(m.text)}</div>`
      : `<div class="bubble ai">${window.marked ? marked.parse(m.text || '') : esc(m.text || '')}${
           m.by === 'gemma' ? '<span class="by">routed locally</span>' : ''}</div>`).join('')
    : '<div class="empty">Ask about this page, or anything else.</div>')
    + (waiting ? '<div class="sysline">Sent. The reply lands here, usually under a minute.</div>' : '');
  if (agMsgs.length) $('atitle').textContent = chatTitle(agMsgs);
  showPage();
  const body = $('abody'); if (body) body.scrollTop = body.scrollHeight;
}
async function agPoll() {
  if (!agentOpen() || agSending) return;
  const t = agT;
  try {
    const j = await ghGet(chatPath(t));
    if (agT !== t || agSending || !j || !j.sha || j.sha === agSha) return;
    const before = agMsgs.length ? agMsgs[agMsgs.length - 1].id : null;
    agSha = j.sha; agText0 = b64decode(j.content); agMsgs = chatParse(agText0); agRender();
    const fresh = agMsgs.slice(agMsgs.findIndex(m => m.id === before) + 1);
    const reply = fresh.filter(m => m.role === 'assistant').pop();
    if (reply) speak(reply.text);
  } catch (e) { /* 404 (no thread yet) or transient: ignore */ }
}
async function agSend() {
  const ta = $('chatin'); const body = ta.value.trim();
  if (!body || agSending) return;
  agSending = true; ta.value = ''; ta.style.height = '';
  // the page rides with the message: agent_loop names it in the prompt
  const msg = chatMsg('user', body, { model: selModel, effort: selEffort, page: pageRef() });
  agMsgs = agMsgs.concat(msg); agRender();
  if (DEMO) { agSending = false; return; }
  const path = chatPath(agT), line = JSON.stringify(msg) + '\n';
  let saved = false;
  for (let attempt = 0; attempt < 3 && !saved; attempt++) {
    const base = agText0 && !agText0.endsWith('\n') ? agText0 + '\n' : agText0;
    let newSha = null, err = null;
    try { newSha = await saveFile(path, base + line, agSha, 'phone: chat message'); }
    catch (e) { err = e; }
    if (newSha) { agSha = newSha; agText0 = base + line; saved = true; break; }
    // 409 stale sha or 422 concurrent create: the agent appended while we typed.
    const f = await loadFile(path).catch(() => null);
    if (!f) { toast('Send failed: ' + (err ? err.message : 'conflict')); break; }
    agSha = f.sha; agText0 = f.text; agMsgs = chatParse(f.text).concat(msg); agRender();
  }
  if (!saved) { agMsgs = agMsgs.filter(m => m.id !== msg.id); agRender(); toast('Not sent. Try again.'); }
  // In a build's thread that message IS the gate answer, so stop the card asking.
  // Only home.json is touched: the job file keeps its gate, which is how the box
  // knows to resume. If the box never picks it up, a reload honestly shows it again.
  else if (/^j-/.test(agT)) await clearHomeGate(agT);
  agSending = false;
  if (!agTimer) agTimer = setInterval(agPoll, 5000);      // a brand-new thread starts polling
}
/* Start his reply for him (the gate answer he picked). Waits for the panel's own
   render, which is async when the thread has to be fetched. */
function chatPrefill(text) {
  const put = () => {
    const ta = $('chatin'); if (!ta) return setTimeout(put, 120);
    ta.value = text; ta.oninput(); ta.focus();
    try { ta.setSelectionRange(text.length, text.length); } catch (e) {}
  };
  put();
}
/* Past chats, in the panel: tapping one loads it without leaving the page. */
async function showChats() {
  const body = $('abody'); if (!body) return;
  const head = '<div class="sect" style="margin:2px 4px 8px">Past chats</div>';
  body.innerHTML = head + skels(3);
  const metas = await chatMetas();
  if (!$('abody')) return;
  body.innerHTML = head + (metas.length
    ? '<div class="rowlist">' + metas.map(m =>
      `<button data-th="${esc(m.thread)}" class="${m.thread === agT ? 'cur' : ''}">
        <span class="ric">&#128172;</span>
        <span class="rtx two">${esc(m.title)}${m.preview ? `<br><span class="muted" style="font-size:13px">${esc(m.preview)}</span>` : ''}</span>
        <span class="muted" style="font-size:12px;flex-shrink:0;margin-left:6px">${ago(m.ts)}</span>
        <span data-del="${esc(m.thread)}" data-sha="${esc(m.sha || '')}" class="muted"
              style="flex-shrink:0;margin-left:8px;padding:2px 8px;font-size:16px">&#128465;</span>
      </button>`).join('') + '</div>'
    : '<div class="empty">No chats yet.</div>');
  body.querySelectorAll('[data-th]').forEach(b => { b.onclick = () => openThread(b.dataset.th); });
  body.querySelectorAll('[data-del]').forEach(x => {
    x.onclick = async e => {
      e.stopPropagation();
      const t = x.dataset.del;
      if (!confirm('Delete this chat? It cannot be undone from the phone.')) return;
      try {
        const r = await gh(chatPath(t), { method: 'DELETE', body: JSON.stringify({
          message: 'phone: delete chat ' + t, sha: x.dataset.sha, branch: 'main' }) });
        if (r.status === 409) return toast('Chat changed while you were looking, reopen the list');
      } catch (err) { return toast(err.message); }
      toast('Chat deleted');
      if (t === agT) return openThread(newThread());
      showChats();
    };
  });
}
function agMic() {
  const ta = $('chatin');
  if (agRec) { agRec.stop(); return; }                 // tap again to stop
  agRec = new SpeechRec();
  agRec.lang = 'en-SG'; agRec.interimResults = true; agRec.continuous = true;
  const before = ta.value ? ta.value + ' ' : '';
  agRec.onresult = e => {
    let heard = '';
    for (let i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;
    ta.value = before + heard; ta.oninput();
  };
  agRec.onerror = e => { toast(e.error === 'not-allowed' ? 'Microphone is blocked in Settings' : 'Mic: ' + e.error); };
  agRec.onend = () => { agRec = null; const m = $('chatmic'); if (m) m.classList.remove('danger'); };
  agRec.start();
  $('chatmic').classList.add('danger');
}

async function lessonView(path) {

/* =============== document view: block editing =============== */
const BLOCK_START = /^(#{1,6}\s|```|~~~|\s*(?:[-*+]|\d+[.)])\s|\s*>|\s*\|)/;
function parseBlocks(text) {
  const lines = text.split('\n');
  const blocks = [];
  const push = (s, e, type) => blocks.push({ start: s, end: e, type, src: lines.slice(s, e + 1).join('\n') });
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^(```|~~~)/.test(l)) {
      const fence = l.match(/^(```|~~~)/)[1];
      let j = i + 1;
      while (j < lines.length && !lines[j].startsWith(fence)) j++;
      push(i, Math.min(j, lines.length - 1), 'code'); i = j + 1; continue;
    }
    if (/^#{1,6}\s/.test(l)) { push(i, i, 'heading'); i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { push(i, i, 'hr'); i++; continue; }
    if (/^\s*(?:[-*+]|\d+[.)])\s/.test(l)) {
      let j = i + 1;   // continuation lines: indented, not a new list item
      while (j < lines.length && /^\s{2,}\S/.test(lines[j]) && !/^\s*(?:[-*+]|\d+[.)])\s/.test(lines[j])) j++;
      push(i, j - 1, 'li'); i = j; continue;
    }
    if (/^\s*>/.test(l)) {
      let j = i + 1; while (j < lines.length && /^\s*>/.test(lines[j])) j++;
      push(i, j - 1, 'quote'); i = j; continue;
    }
    if (/^\s*\|/.test(l)) {
      let j = i + 1; while (j < lines.length && /^\s*\|/.test(lines[j])) j++;
      push(i, j - 1, 'table'); i = j; continue;
    }
    let j = i + 1;
    while (j < lines.length && lines[j].trim() && !BLOCK_START.test(lines[j])) j++;
    push(i, j - 1, 'p'); i = j;
  }
  return blocks;
}
/* split a list-item block into editable prefix ("- [ ] ") and text */
const LI_RE = /^(\s*(?:[-*+]|\d+[.)])\s+(?:\[( |x|X)\]\s+)?)([\s\S]*)$/;
function liParts(src) {
  const m = src.match(LI_RE);
  return m ? { prefix: m[1], boxed: m[2] !== undefined, text: m[3] } : { prefix: '', boxed: false, text: src };
}

function renderDoc() {
  const doc = $('doc');
  if (!doc) return;
  const blocks = parseBlocks(cur.text);
  doc.innerHTML = '';
  let listWrap = null, listIndent = null;
  blocks.forEach((b, bi) => {
    const el = document.createElement('div');
    el.className = 'blk'; el.dataset.bi = bi;
    if (b.type === 'li') {
      const indent = b.src.match(/^\s*/)[0].length;
      if (!listWrap || indent !== listIndent) {
        if (listWrap) addListPlus(listWrap, blocks);
        listWrap = document.createElement('div'); listWrap.className = 'listrun';
        listWrap.style.marginLeft = (indent * 0.55) + 'em';
        listIndent = indent; doc.appendChild(listWrap);
      }
      el.innerHTML = marked.parse(b.src.replace(new RegExp('^\\s{0,' + listIndent + '}', 'gm'), ''), { gfm: true });
      styleTaskList(el, b);
      listWrap.appendChild(el);
      if (bi === blocks.length - 1) addListPlus(listWrap, blocks);
    } else {
      if (listWrap) { addListPlus(listWrap, blocks); listWrap = null; listIndent = null; }
      el.innerHTML = b.type === 'hr' ? '<hr style="border:none;border-top:1px solid var(--line);margin:18px 0">'
        : marked.parse(b.src, { gfm: true });
      doc.appendChild(el);
    }
    if (b.type !== 'li' && listWrap) { listWrap = null; listIndent = null; }
    el.addEventListener('click', ev => {
      if (ev.target.closest('input,button')) return;
      const a = ev.target.closest('a');
      if (a) { handleLink(ev, a); return; }
      startBlockEdit(el, bi);
    });
  });
  const add = document.createElement('button');
  add.className = 'addblock'; add.innerHTML = ICONS.plus + ' Add text';
  add.onclick = () => startBlockEdit(null, -1);

}
function addListPlus(wrap, blocks) {

  const bi = +lastEl.dataset.bi;
  const b = blocks[bi];
  const p = liParts(b.src.split('\n')[0]);
  const btn = document.createElement('button');
  btn.className = 'additem'; btn.innerHTML = ICONS.plus + (p.boxed ? ' To-do' : ' Item');

function styleTaskList(el, b) {
  const box = el.querySelector('input[type=checkbox]');

  const li = el.querySelector('li');
  if (box.checked && li) li.classList.add('done');
  box.disabled = false;
  box.onchange = async () => {
    box.disabled = true;
    const src = b.src.replace(/\[( |x|X)\]/, m => m === '[ ]' ? '[x]' : '[ ]');
    const ok = await spliceSave(b, src, 'phone: toggle task in ' + cur.path);

}
function handleLink(ev, a) {
  const href = a.getAttribute('href') || '';
  if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
  ev.preventDefault();
  if (href.startsWith('#')) return;
  const base = cur.path.split('/').slice(0, -1);
  const parts = href.split('/');
  for (const p of parts) {
    if (p === '..') base.pop(); else if (p !== '.') base.push(p);
  }
  location.hash = '#/p/' + encodeURIComponent(base.join('/').split('#')[0]);
}
/* replace block bi's lines with newSrc (null = delete), commit, re-render */
async function spliceSave(b, newSrc, msg, extraLine) {
  const lines = cur.text.split('\n');
  if (newSrc === null) lines.splice(b.start, b.end - b.start + 1);
  else if (extraLine) lines.splice(b.end + 1, 0, ...newSrc.split('\n'));   // insert AFTER block
  else lines.splice(b.start, b.end - b.start + 1, ...newSrc.split('\n'));
  const next = lines.join('\n');
  try {
    const sha = await saveFile(cur.path, next, cur.sha, msg);
    if (!sha) { toast('File changed elsewhere. Reloading.'); await reloadCur(); return false; }
    cur.text = next; cur.sha = sha;
    const y = window.scrollY; renderDoc(); window.scrollTo(0, y);
    return true;
  } catch (e) { toast('Save failed: ' + e.message); return false; }
}
async function reloadCur() {
  cur = await loadFile(cur.path);
  const y = window.scrollY; renderDoc(); window.scrollTo(0, y);
}
function startBlockEdit(el, bi) {
  document.querySelectorAll('.blkedit').forEach(x => x.remove());
  document.querySelectorAll('.blk.hidden-edit').forEach(x => { x.style.display = ''; x.classList.remove('hidden-edit'); });
  const blocks = parseBlocks(cur.text);
  const b = bi >= 0 ? blocks[bi] : null;
  let display = '', prefix = '', suffix = '';
  if (b) {
    if (b.type === 'heading') {
      const m = b.src.match(/^(#{1,6}\s+)([\s\S]*)$/); prefix = m[1]; display = m[2];
    } else if (b.type === 'li' && !b.src.includes('\n')) {
      const p = liParts(b.src); prefix = p.prefix; display = p.text;
    } else display = b.src;
  }
  const ed = document.createElement('div');
  ed.className = 'blkedit';
  ed.innerHTML = `<textarea id="bed"></textarea>
    <div class="ebar">
      <button class="primary" id="bsave">Save</button>
      <button class="ghost" id="bcancel">Cancel</button>
      <span class="sp"></span>
      ${b ? `<button class="iconbtn" id="bdel" aria-label="Delete" style="color:var(--danger)">${ICONS.trash}</button>` : ''}
    </div>`;
  if (el) { el.style.display = 'none'; el.classList.add('hidden-edit'); el.after(ed); }
  else $('doc').insertBefore(ed, $('doc').lastElementChild);
  const ta = ed.querySelector('#bed');
  ta.value = display;
  const fit = () => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; };
  ta.addEventListener('input', fit); fit(); ta.focus();
  const close = () => { ed.remove(); if (el) { el.style.display = ''; el.classList.remove('hidden-edit'); } };
  ed.querySelector('#bcancel').onclick = close;
  ed.querySelector('#bsave').onclick = async () => {
    const v = ta.value.replace(/\s+$/, '');
    if (b) {
      if (!v.trim()) { await spliceSave(b, null, 'phone: delete block in ' + cur.path); return; }
      await spliceSave(b, prefix + v + suffix, 'phone: edit ' + cur.path);
    } else {
      if (!v.trim()) { close(); return; }
      const lines = cur.text.replace(/\s+$/, '');
      const next = (lines ? lines + '\n\n' : '') + v + '\n';
      try {
        const sha = await saveFile(cur.path, next, cur.sha, 'phone: add to ' + cur.path);
        if (!sha) { toast('File changed elsewhere. Reloading.'); await reloadCur(); return; }
        cur.text = next; cur.sha = sha; renderDoc();
        window.scrollTo(0, document.body.scrollHeight);
      } catch (e) { toast('Save failed: ' + e.message); }
    }
  };
  const del = ed.querySelector('#bdel');
  if (del) del.onclick = async () => { await spliceSave(b, null, 'phone: delete block in ' + cur.path); };
}
function insertListItem(bi, parts) {
  const blocks = parseBlocks(cur.text);
  const b = blocks[bi];
  const ed = document.createElement('div');
  ed.className = 'blkedit';
  ed.innerHTML = `<textarea id="ned" placeholder="New item"></textarea>
    <div class="ebar"><button class="primary" id="nsave">Add</button>
    <button class="ghost" id="ncancel">Cancel</button></div>`;
  const host = document.querySelector(`.blk[data-bi="${bi}"]`);
  host.parentElement.insertBefore(ed, host.nextSibling);
  const ta = ed.querySelector('#ned'); ta.focus();
  ed.querySelector('#ncancel').onclick = () => ed.remove();
  ed.querySelector('#nsave').onclick = async () => {
    const v = ta.value.trim(); if (!v) { ed.remove(); return; }
    let prefix = parts.prefix;
    const num = prefix.match(/^(\s*)(\d+)([.)])(\s+)/);
    if (num) prefix = num[1] + (parseInt(num[2]) + 1) + num[3] + num[4];
    if (parts.boxed) prefix = prefix.replace(/\[( |x|X)\]/, '[ ]');
    await spliceSave(b, prefix + v, 'phone: add item to ' + cur.path, true);
  };
}

/* =============== weekly plan ===============
   A weekly plan is just a markdown file at plans/weekly/YYYY-Www.md, so it views
   and edits with the normal block editor. The only extras: create this week's file
   from a template, and pull the real week's calendar into its "Fixed" section. */
const WEEKLY_RE = /^plans\/weekly\/\d{4}-W\d{2}\.md$/;
const WEEKLY_FIXED_HEAD = '## Fixed this week (from your calendar)';
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;                       // Mon=1..Sun=7
  t.setUTCDate(t.getUTCDate() + 4 - day);               // ISO: to Thursday of this week
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  return { year: t.getUTCFullYear(), week };
}
/* the Monday of the week we should be planning: on the weekend, plan the week ahead */
function planMonday(d) {
  const m = new Date(d); m.setHours(0, 0, 0, 0);
  const wd = m.getDay();                                // 0 Sun .. 6 Sat
  if (wd === 6) m.setDate(m.getDate() + 2);            // Sat -> next Mon
  else if (wd === 0) m.setDate(m.getDate() + 1);       // Sun -> next Mon
  else m.setDate(m.getDate() - (wd - 1));              // Mon..Fri -> this Mon
  return m;
}
function weekFilePath(mon) {
  const { year, week } = isoWeek(mon);
  return 'plans/weekly/' + year + '-W' + pad(week) + '.md';
}
function longDate(d) { return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
async function weekEventLines(mon, nextMon) {
  const evs = await gcalList(mon, nextMon);
  if (!evs.length) return ['_No events on your calendar this week._'];
  return evs
    .map(ev => ({ s: new Date(ev.start.dateTime || ev.start.date + 'T00:00:00'), timed: !!ev.start.dateTime, summary: ev.summary || '(no title)' }))
    .sort((a, b) => a.s - b.s)
    .map(e => '- ' + DAYS[e.s.getDay()] + ' ' + e.s.getDate() + ' ' + MONTHS[e.s.getMonth()]
      + (e.timed ? ', ' + fmtTime(e.s) : ', all day') + ' — ' + e.summary);
}
async function fixedSectionBody(mon, nextMon) {
  return ['_Tap the calendar button in the header to refresh. Plan your deep work around these._',
    ...(await weekEventLines(mon, nextMon))];
}
function weeklyTemplate(mon, fixedBody) {
  return [
    '# Weekly plan — week of ' + longDate(mon), '',
    '## Outcomes this week (pick 2-3)',
    '_The few things that actually move you toward your goals, not a to-do dump._',
    '- [ ] ', '- [ ] ', '',
    WEEKLY_FIXED_HEAD,
    ...fixedBody, '',
    '## Deep work at your energy peaks',
    '_Hardest, most important work at your daily peak; admin in the troughs._',
    '### Peak (your sharpest hours)', '- [ ] ',
    '### Middle', '- [ ] ',
    '### Trough (low energy / admin)', '- [ ] ', '',
    '## If-then scripts',
    '_Pre-decide your response to an obstacle you can already see coming._',
    '- If , then ', '',
    '## Recovery (schedule it, do not leave it to chance)',
    '- [ ] ', '',
    '_Keep focused work under ~50 hours; past that, output per hour drops. Method: Justin Sung (references/justin-sung-channel-takeaways-2026-07.md)._', ''
  ].join('\n');
}
/* rewrite the Fixed section body in place, keeping every other block untouched */
function replaceFixedSection(text, bodyLines) {
  const lines = text.split('\n');
  const start = lines.findIndex(l => /^##\s+Fixed this week/.test(l));
  if (start < 0) return null;
  let end = start + 1;
  while (end < lines.length && !/^##\s/.test(lines[end])) end++;
  return [...lines.slice(0, start + 1), '', ...bodyLines, '', ...lines.slice(end)]
    .join('\n').replace(/\n{3,}/g, '\n\n');
}
async function fileExists(path) {
  if (DEMO) return false;                               // demo: always build so the template + demo calendar show
  try { await ghGet(path); return true; }
  catch (e) { if (/\b404\b/.test(e.message)) return false; throw e; }
}
async function openWeeklyPlan() {
  setHeader('Weekly plan', { back: true });
  $('main').innerHTML = skels(3);
  const mon = planMonday(new Date());
  const nextMon = new Date(mon); nextMon.setDate(nextMon.getDate() + 7);
  const path = weekFilePath(mon);
  try {
    if (!(await fileExists(path))) {
      let body = null;
      if (gtokValid()) { try { body = await fixedSectionBody(mon, nextMon); } catch (_) {} }
      if (!body) body = ['_Connect Google in Settings, then use the calendar button to pull your week._'];
      const sha = await saveFile(path, weeklyTemplate(mon, body), undefined, 'phone: start weekly plan ' + path.split('/').pop());
      if (!sha) { $('main').innerHTML = '<p class="err">Could not create the weekly plan.</p>'; return; }
    }
  } catch (e) { $('main').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  location.replace(location.pathname + location.search + '#/p/' + encodeURIComponent(path));
}
/* header action on a weekly-plan page: pull the current week's events into Fixed */
async function refreshWeeklyCalendar() {
  if (!gtokValid()) { gAuth(refreshWeeklyCalendar); return; }   // sync from the tap, so the popup is allowed
  const mon = planMonday(new Date());
  const nextMon = new Date(mon); nextMon.setDate(nextMon.getDate() + 7);
  let body;
  try { body = await fixedSectionBody(mon, nextMon); } catch (e) { toast(e.message); return; }
  const next = replaceFixedSection(cur.text, body);
  if (next === null) { toast('No "Fixed this week" section to update'); return; }
  if (next === cur.text) { toast('Calendar already up to date'); return; }
  try {
    const sha = await saveFile(cur.path, next, cur.sha, 'phone: refresh weekly calendar');
    if (!sha) { toast('File changed elsewhere. Reloading.'); await reloadCur(); return; }
    cur.text = next; cur.sha = sha;
    const y = window.scrollY; renderDoc(); window.scrollTo(0, y);
    toast('Calendar updated');
  } catch (e) { toast('Save failed: ' + e.message); }
}

async function rawView(path, alreadyLoaded) {

  $('main').innerHTML = `

async function rawSave() {

/* =============== Udemy script view =============== */
const WPM = 145;
const ANIM_RE = /^anim:\s?/, VIS_RE = /^(visual:|action:)/, RES_RE = /^resource:\s?/;
function uParse(text) {
  const lines = text.split('\n');
  const out = [];
  let c = { kind: 'prose', marker: null, lines: [] };
  const flush = () => { if (c.lines.length || c.kind === 'block') out.push(c); };
  for (const line of lines) {
    const m = line.match(/^\[(SLIDE|DEMO) [^\]]+\]\s*$/);
    const ends = /^(#{1,3} |---\s*$)/.test(line);
    if (m) { flush(); c = { kind: 'block', marker: line.trim(), lines: [] }; }
    else if (ends && c.kind === 'block') { flush(); c = { kind: 'prose', marker: null, lines: [line] }; }
    else c.lines.push(line);
  }
  flush();
  return out.map(s => {
    if (s.kind === 'prose') return { kind: 'prose', text: s.lines.join('\n') };
    const anim = s.lines.filter(l => ANIM_RE.test(l)).map(l => l.replace(ANIM_RE, ''));
    const res = s.lines.filter(l => RES_RE.test(l)).map(l => l.replace(RES_RE, ''));
    const vis = s.lines.filter(l => VIS_RE.test(l));
    const narr = s.lines.filter(l => !ANIM_RE.test(l) && !VIS_RE.test(l) && !RES_RE.test(l));
    while (narr.length && !narr[0].trim()) narr.shift();
    while (narr.length && !narr[narr.length - 1].trim()) narr.pop();
    return { kind: 'block', marker: s.marker, visual: vis.join('\n'), narr: narr.join('\n'), anim: anim.join('\n'), res: res.join('\n') };
  });
}
function uSerialize(segs) {
  return segs.map(s => {
    if (s.kind === 'prose') return s.text;
    const out = [s.marker];
    out.push(...s.visual.split('\n').filter(l => l.trim()));
    out.push(...s.anim.split('\n').filter(l => l.trim()).map(l => 'anim: ' + l.trim()));
    out.push(...(s.res || '').split('\n').filter(l => l.trim()).map(l => 'resource: ' + l.trim()));
    const narr = s.narr.replace(/\s+$/, '');
    if (narr.trim()) { out.push(''); out.push(...narr.split('\n')); }
    out.push('');
    return out.join('\n');
  }).join('\n');
}
function narrWords(t) { t = t.trim(); return t ? t.split(/\s+/).length : 0; }
function fmtDur(w) { const s = Math.round(w / WPM * 60); return Math.floor(s / 60) + ':' + pad(s % 60); }
function uPreview(seg, el) {
  const isDemo = seg.marker.startsWith('[DEMO');
  const vLines = seg.visual.split('\n').map(l => l.trim())
    .filter(l => VIS_RE.test(l)).map(l => l.replace(/^(visual:|action:)\s*/, ''));
  const inner = vLines.join(' ').split(/(?<=[.:]) /).map(t => '<div class="v-line">' + esc(t) + '</div>').join('');
  el.innerHTML = isDemo
    ? '<div class="screen"><div class="chrome"><i></i><i></i><i></i>&nbsp;screen recording</div><div class="body">' + inner + '</div></div>'
    : '<div class="board"><div class="b-kicker">sketch: dark canvas, hand-drawn</div>' + inner + '</div>';
}
async function udemyView(path) {

      const mkField = (parent, lbl, cls, val, key, ph) => {

      mkField(left, 'Resources (for students)', 'mono', seg.res, 'res', 'One per line: file, link, or note to include with this lesson');
      mkField(rightCol, 'Narration (spoken + captions)', '', seg.narr, 'narr', 'What the voice says over this slide');
      root.appendChild(card);
      refresh();
    });
    totals();
  }
  $('usavebtn').onclick = async () => {
    let text = uSerialize(segs);
    if (!text.endsWith('\n')) text += '\n';
    $('usavebtn').disabled = true;
    try {
      const sha = await saveFile(cur.path, text, cur.sha, 'phone: edit script ' + name);
      if (!sha) {
        localStorage.setItem(draftKey, text);
        cur = await loadFile(path);
        $('ubanner').innerHTML = `<div class="banner">The file changed elsewhere (probably Claude edited it), so your version was
          kept as a draft on this device instead of overwriting. Reloaded the latest file.
          <div class="brow"><button class="primary" onclick="location.reload()">OK</button></div></div>`;
        segs = uParse(cur.text); dirty = false; $('usave').style.display = 'none'; build();
        window.scrollTo(0, 0);
        return;
      }
      cur.text = text; cur.sha = sha; dirty = false;
      $('usave').style.display = 'none'; toast('Saved');
    } catch (e) { toast('Save failed: ' + e.message); }
    $('usavebtn').disabled = false;
  };
  $('udiscard').onclick = () => {
    if (!confirm('Discard your edits and reload?')) return;
